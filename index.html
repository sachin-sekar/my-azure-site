<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Digital Gate Pass</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Digital Gate Pass</h2>
        <form id="passForm">
            <input type="text" id="studentName" placeholder="Full Name" required>
            <input type="text" id="roomNo" placeholder="Room Number" required>
            <textarea id="reason" placeholder="Reason for leaving" required></textarea>
            <button type="submit">Generate Pass & Log Exit</button>
        </form>

        <div id="qrcode-container">
            <h3>Your Scan Code</h3>
            <div id="qrcode"></div>
            <p>Show this at the gate</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

        <div id="complaintList" class="complaint-list">

                <div class="status-info">
                    <strong>#ID-8821</strong> | Plumbing
                    <p>Tap leakage in bathroom.</p>

</body>
