<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Azure Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="container">
            <h1>My Portfolio</h1>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </div>
    </nav>

    <header id="home">
        <div class="hero-content">
            <h2>Welcome to My Azure-Hosted Site</h2>
            <p>Deployed successfully using Azure Static Web Apps.</p>
            <button onclick="showMessage()">Click Me</button>
            <p id="display-message"></p>
        </div>
    </header>

    <section id="about" class="container">
        <h2>About This Project</h2>
        <p>This is a simple full-stack ready template designed for quick deployment. It uses HTML5, CSS3, and a touch of JavaScript.</p>
    </section>

    <footer>
        <p>&copy; 2026 | Built with Azure & GitHub</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
